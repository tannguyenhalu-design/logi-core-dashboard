name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build-time only — no real Sheets/Calendar calls happen during
          # `next build` (all data fetching is in getServerSideProps /
          # API routes, which run at request time, not build time).
          # These exist purely so any accidental module-level env access
          # fails loudly in CI instead of silently passing.
          GOOGLE_SHEET_ID: ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret
          USERS_JSON: "[]"
