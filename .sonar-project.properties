# .sonar-project.properties — SonarQube Configuration
# Dự án: SD3 Control Tower
# GitLab: gitlab.ghn.vn (nội bộ GHN)
# SonarQube host: cấu hình qua CI/CD variable SONAR_HOST_URL
#
# Chạy local: sonar-scanner -Dsonar.host.url=https://sonarqube.gitlab.ghn.vn -Dsonar.login=<token>

sonar.projectKey=miniapp-sd3-control-tower
sonar.projectName=SD3 Control Tower
sonar.projectVersion=1.0

# Source code
sonar.sources=pages,components,lib
sonar.tests=

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — bỏ qua các thư mục không cần quét
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  coverage/**,\
  public/**,\
  **/*.test.js,\
  **/*.spec.js,\
  lib/backup-data.json,\
  lib/centroids.json

# Test coverage (Jest lcov output)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=js

# SonarQube Quality Gate thresholds (sẽ áp dụng trên server):
# - Coverage mới: ≥ 60%
# - Duplications mới: ≤ 3%
# - Security vulnerabilities: 0 (Critical/High)
# - Code smells: A grade

# Ref: https://docs.sonarqube.org/latest/analysis/scan/sonarscanner/
